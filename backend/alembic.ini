[alembic]
# Path to migration scripts
script_location = alembic

prepend_sys_path = .

# Template file for new revisions
version_path_separator = os

# URL is overridden in env.py from settings — this value is a placeholder
sqlalchemy.url = postgresql://placeholder/placeholder

[post_write_hooks]
# Optionally run black/isort on generated migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

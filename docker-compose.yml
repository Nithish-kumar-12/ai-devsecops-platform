version: '3.9'

# =============================================================================
# AI DevSecOps Platform — Production Docker Compose
# Usage: cp .env.example .env && docker compose up --build
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 15
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devsecops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devsecops_pass_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-devsecops_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devsecops} -d ${POSTGRES_DB:-devsecops_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devsecops_net

  # ---------------------------------------------------------------------------
  # Redis 7 (Celery broker + result backend + cache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devsecops_net

  # ---------------------------------------------------------------------------
  # Backend — FastAPI (Uvicorn)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devsecops}:${POSTGRES_PASSWORD:-devsecops_pass_change_me}@postgres:5432/${POSTGRES_DB:-devsecops_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-devsecops}:${POSTGRES_PASSWORD:-devsecops_pass_change_me}@postgres:5432/${POSTGRES_DB:-devsecops_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ZAP_BASE_URL: http://zap:8080
    volumes:
      - scan_uploads:/tmp/devsecops_uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - devsecops_net

  # ---------------------------------------------------------------------------
  # Celery Worker (runs scan tasks asynchronously)
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q scans,default
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devsecops}:${POSTGRES_PASSWORD:-devsecops_pass_change_me}@postgres:5432/${POSTGRES_DB:-devsecops_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-devsecops}:${POSTGRES_PASSWORD:-devsecops_pass_change_me}@postgres:5432/${POSTGRES_DB:-devsecops_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ZAP_BASE_URL: http://zap:8080
    volumes:
      - scan_uploads:/tmp/devsecops_uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devsecops_net

  # ---------------------------------------------------------------------------
  # Celery Flower (task monitoring UI — dev/staging only)
  # ---------------------------------------------------------------------------
  celery-flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flowerpass}
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - devsecops_net

  # ---------------------------------------------------------------------------
  # OWASP ZAP (DAST — daemon mode)
  # ---------------------------------------------------------------------------
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    restart: unless-stopped
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.disablekey=true
    networks:
      - devsecops_net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/JSON/core/view/version/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ---------------------------------------------------------------------------
  # Frontend (React — built and served by nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - devsecops_net

  # ---------------------------------------------------------------------------
  # Nginx reverse proxy (public entry point)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - devsecops_net

# =============================================================================
volumes:
  postgres_data:
  redis_data:
  scan_uploads:

networks:
  devsecops_net:
    driver: bridge
